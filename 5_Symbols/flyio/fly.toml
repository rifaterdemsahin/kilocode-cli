app = "kilo-remote"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  KILO_CONFIG_DIR = "/root/.config/kilo"

[mounts]
  source = "kilo_data"
  destination = "/root/projects"

[http_service]
  internal_port = 7681
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 10
    soft_limit = 5

[[services]]
  internal_port = 2222
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 2222
    handlers = []
